<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

              <rect width="97.04" height="97.04" fill="white" />

        </svg>
      </div>

      <div class="card">
        <h1>Equal WiFi</h1>
        <div class="support-callout">
          <strong>Need help?</strong> Call
          <a href="tel:+263780186564">+263 78 018 6564</a>
        </div>
        <hr />

        <div class="hint" id="oper-hint"></div>

        <form id="login-form">
          <div class="form-group">
            <input
              id="voucherCode"
              class="input voucher-input"
              name="voucherCode"
              type="text"
              placeholder="Enter Voucher (e.g. 12345678)"
              inputmode="numeric"
              autocomplete="off"
              autocapitalize="off"
              autocorrect="off"
              spellcheck="false"
            />
          </div>
          <input name="clientMac" id="cMac" style="display: none" />
          <!-- Used by original portal logic -->
          <input name="radiusSvrIp" id="radiusServerIp" style="display: none" />
          <!-- Used by original portal logic -->
          <button type="button" id="button-login" class="button">
            Connect
          </button>
          <div class="or-divider"><span>OR</span></div>
          <button type="button" id="button-ecocash" class="button secondary">
            Buy Voucher with &nbsp;<span class="ecocash-text">
              <span class="eco">Eco</span><span class="cash">Cash</span>
            </span>
          </button>
        </form>

        <table id="voucher-display-table">
          <thead>
            <tr>
              <th>Data Limit</th>
              <th>Duration</th>
              <th>Price</th>
            </tr>
          </thead>
          <tbody id="voucher-display-tbody">
            <tr>
              <td colspan="3" style="text-align: center">
                Loading packages...
              </td>
            </tr>
          </tbody>
          <tfoot id="voucher-display-tfoot">
            <tr>
              <td colspan="3">Unlimited and Fast Internet</td>
            </tr>
          </tfoot>
        </table>
      </div>

      <div class="footer">
        <div class="footer-card">
          <div class="footer-label">Powered by</div>
          <a
            class="footer-brand"
            href="http://xash.co.zw"
            target="_blank"
            rel="noopener noreferrer"
          >
            Xash
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              width="16"
              height="16"
              fill="currentColor"
              aria-hidden="true"
            >
              <path
                d="M14 3h7v7h-2V6.41l-9.59 9.59-1.41-1.41L17.59 5H14V3zm-1 5v2H5v10h10v-8h2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V10a2 2 0 0 1 2-2h8z"
              />
            </svg>
          </a>
          <div class="footer-meta">
            &copy; <span id="dynamic-year"></span> Xash. Vouchers available
            from any Xash Dealer.
          </div>
        </div>
      </div>
    </div>

    <!-- Ecocash Modal -->
    <div class="modal" id="ecocash-modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Buy WiFi Voucher</h2>
          <button class="close-modal" id="close-modal">×</button>
        </div>
        <div class="modal-hint" id="modal-hint"></div>
        <form id="ecocash-form">
          <div class="form-group">
            <select id="voucher-package" class="input" required>
              <option value="" disabled selected>Loading packages...</option>
            </select>
          </div>
          <div class="form-group">
            <input
              type="tel"
              id="ecocash-number"
              class="input"
              placeholder="EcoCash Number (e.g. 0771234567)"
              required
              pattern="^(07[7-8]\d{7}|2637[7-8]\d{7}|\+2637[7-8]\d{7})$"
              title="Enter a valid EcoCash number (077/078...)"
            />
          </div>
          <button type="button" id="submit-ecocash" class="button">
            Pay Now
          </button>
        </form>
      </div>
    </div>

    <div class="ad-overlay" id="ad-overlay" aria-hidden="true">
      <div class="ad-panel" role="dialog" aria-modal="true">
        <div class="ad-header">
          <span class="ad-label">Sponsored</span>
          <button class="ad-close" id="ad-close" aria-label="Close ad">
            ×
          </button>
        </div>
        <div class="ad-frame-wrap">
          <iframe
            id="ad-iframe"
            title="Sponsored content"
            loading="lazy"
            referrerpolicy="no-referrer"
            sandbox="allow-same-origin allow-scripts allow-forms allow-popups"
          ></iframe>
          <img id="ad-image" alt="Sponsored promotion" />
        </div>
        <div class="ad-message" id="ad-message">
          Promote your business here. Ask about Wi‑Fi ads.
        </div>
        <div class="ad-actions">
          <button class="button ad-continue" id="ad-continue">
            Continue
          </button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
